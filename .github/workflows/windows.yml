name: Windows build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build launcher
        shell: powershell
        run: ./Build.ps1
      - name: Test synthetic imports and WPF startup
        shell: powershell
        run: |
          ./tests/Test-DirectoryLens.ps1
          ./tests/Test-Defender.ps1
          ./tests/Test-Groups.ps1
          ./tests/Test-Reports.ps1
      - name: Build empty portable package
        shell: powershell
        run: ./Package.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Directory-Lens-portable
          path: |
            dist/*.zip
            dist/*.sha256
  analyze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: PSScriptAnalyzer (errors fail the job, warnings are listed)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          }
          $findings = @(Invoke-ScriptAnalyzer -Path . -Recurse)
          $findings | Group-Object Severity, RuleName | Sort-Object Count -Descending | Format-Table Count, Name -AutoSize | Out-String -Width 200
          $errors = @($findings | Where-Object { $_.Severity -in 'Error', 'ParseError' })
          if ($errors.Count) {
            $errors | Format-Table ScriptName, Line, RuleName, Message -AutoSize | Out-String -Width 300
            throw "$($errors.Count) analyzer errors"
          }
