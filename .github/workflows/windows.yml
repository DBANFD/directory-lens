name: Windows build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build launcher
        shell: powershell
        run: ./Build.ps1
      - name: Test synthetic imports and WPF startup
        shell: powershell
        run: |
          ./tests/Test-DirectoryLens.ps1
          ./tests/Test-Defender.ps1
          ./tests/Test-Groups.ps1
          ./tests/Test-Reports.ps1
      - name: Build empty portable package
        shell: powershell
        run: ./Package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Directory-Lens-portable
          path: |
            dist/*.zip
            dist/*.sha256
