name: Release portable package
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag must match VERSION
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag $env:RELEASE_TAG does not match VERSION $version" }
      - name: Build launcher
        shell: powershell
        run: ./Build.ps1
      - name: Test synthetic imports and WPF startup
        shell: powershell
        run: |
          ./tests/Test-DirectoryLens.ps1
          ./tests/Test-Defender.ps1
          ./tests/Test-Groups.ps1
          ./tests/Test-Reports.ps1
      - name: Build empty portable package
        shell: powershell
        run: ./Package.ps1
      - name: Write release notes from the changelog
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $lines = Get-Content CHANGELOG.md
          $start = [Array]::IndexOf($lines, @($lines | Where-Object { $_ -like "## $version*" })[0])
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $version" }
          $rest = @($lines[($start + 1)..($lines.Count - 1)])
          $next = [Array]::IndexOf($rest, @($rest | Where-Object { $_ -like '## *' })[0])
          if ($next -lt 0) { $next = $rest.Count }
          $body = @($rest[0..($next - 1)]) + @('', 'The executable is unsigned. Verify the download against the .sha256 file, or with `gh attestation verify <zip> --repo DBANFD/directory-lens`.')
          $body | Set-Content dist/notes.md -Encoding UTF8
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Create draft release for verification
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Extension -in '.zip', '.sha256' } | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --draft --verify-tag --title "Directory Lens $env:RELEASE_TAG" --notes-file dist/notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
